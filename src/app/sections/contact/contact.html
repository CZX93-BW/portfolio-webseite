<section id="contact" class="contact section" aria-labelledby="contact-title">
  <div class="contact__container">
    <div class="contact__content">
      <p class="contact__label">{{ text().label }}</p>

      <h2 id="contact-title">{{ text().title }}</h2>

      <div class="contact__text">
        <h3>{{ text().problemTitle }}</h3>
        <p>{{ text().intro }}</p>

        <p>
          {{ text().needDeveloper }}
          <a href="#contact">{{ text().talkLink }}</a>
        </p>
      </div>
    </div>

    <form class="contact__form" [formGroup]="contactForm" (input)="handleTextInput($event)" (focusout)="hasPendingEdit = false" (ngSubmit)="submitContactForm()" novalidate>
      <label class="contact__field">
        <span>{{ text().nameLabel }}</span>
        <input type="text" name="name" formControlName="name" aria-required="true" [attr.aria-invalid]="shouldShowError('name')" [attr.aria-describedby]="shouldShowError('name') ? 'contact-name-error' : null" [placeholder]="text().namePlaceholder" autocomplete="name" />
        <small id="contact-name-error" class="contact__error" [class.contact__error--hidden]="!shouldShowError('name')">
          {{ text().nameError }}
        </small>
      </label>

      <label class="contact__field">
        <span>{{ text().emailLabel }}</span>
        <input type="email" name="email" formControlName="email" aria-required="true" [attr.aria-invalid]="shouldShowError('email')" [attr.aria-describedby]="shouldShowError('email') ? 'contact-email-error' : null" [placeholder]="text().emailPlaceholder" autocomplete="email" />
        <small id="contact-email-error" class="contact__error" [class.contact__error--hidden]="!shouldShowError('email')">
          {{ text().emailError }}
        </small>
      </label>

      <label class="contact__field">
        <span>{{ text().messageLabel }}</span>
        <textarea name="message" formControlName="message" aria-required="true" [attr.aria-invalid]="shouldShowError('message')" [attr.aria-describedby]="shouldShowError('message') ? 'contact-message-error' : null" [placeholder]="text().messagePlaceholder" rows="3"></textarea>
        <small id="contact-message-error" class="contact__error" [class.contact__error--hidden]="!shouldShowError('message')">
          {{ text().messageError }}
        </small>
      </label>

      <div class="contact__honeypot" aria-hidden="true">
        <label for="contact-website">{{ text().websiteLabel }}</label>
        <input
          id="contact-website"
          name="website"
          type="text"
          formControlName="website"
          autocomplete="off"
          tabindex="-1"
        />
      </div>

      <div class="contact__privacy">
        <label class="contact__checkbox">
          <input type="checkbox" formControlName="privacyAccepted" aria-required="true" [attr.aria-invalid]="shouldShowError('privacyAccepted')" [attr.aria-describedby]="shouldShowError('privacyAccepted') ? 'contact-privacy-error' : null" />
          <span class="contact__custom-checkbox" aria-hidden="true"></span>

          <span>
            {{ text().privacyStart }}
            <a routerLink="/privacy-policy">{{ text().privacyLink }}</a>
            {{ text().privacyEnd }}
          </span>
        </label>

        <small id="contact-privacy-error" class="contact__privacy-error" [class.contact__error--hidden]="!shouldShowError('privacyAccepted')">
          {{ text().privacyError }}
        </small>
      </div>

      <button class="contact__button" type="submit" [disabled]="submitDisabled">
        <span>
          @if (isSending) {
            {{ text().sending }}
          } @else {
            {{ text().submit }}
          }
        </span>
      </button>

      <p class="contact__feedback" aria-live="polite">
        @if (sendSuccess) {
          {{ text().success }}
        }

        @if (sendError) {
          {{ text().error }}
        }
      </p>
    </form>
  </div>
</section>

<footer class="footer">
  <div class="footer__container">
    <div class="footer__brand">
      <a class="footer__logo" routerLink="/" fragment="home" [attr.aria-label]="text().homepageLabel">
        <img
          class="footer__logo-image"
          src="img/bw-logo-option-1.svg"
          alt=""
          width="185"
          height="114"
          aria-hidden="true"
        />
      </a>

      <div class="footer__info">
        <p>{{ text().role }}</p>
        <p>{{ text().location }}</p>
      </div>
    </div>

    <p class="footer__copyright">{{ text().copyright }}</p>

    <nav class="footer__navigation" [attr.aria-label]="text().navigationLabel">
      @for (link of footerLinks(); track link.label) {
        @if (link.routerLink) {
          <a class="footer__link" [routerLink]="link.routerLink">
            {{ link.label }}
          </a>
        } @else {
          <a class="footer__link" [href]="link.href" target="_blank" rel="noopener noreferrer">
            {{ link.label }}
          </a>
        }
      }
    </nav>
  </div>
</footer>
